openapi: 3.1.0
info:
  title: Propuesta de API de candidaturas SIGAPE
  version: 1.0.0
  description: Propuesta pendiente de aprobación; consulta mínima del estado de una candidatura.
x-estado-propuesta: pendiente-de-aprobacion
servers:
  - url: http://candidaturas:8000/api/v1
    description: Nombre y puerto internos propuestos para desarrollo con Docker.
paths:
  /candidaturas/{idCandidatura}:
    get:
      operationId: consultarCandidatura
      summary: Consultar el estado de una candidatura
      parameters:
        - name: idCandidatura
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Candidatura encontrada.
          content:
            application/json:
              schema:
                type: object
                required: [idCandidatura, estado]
                properties:
                  idCandidatura:
                    type: string
                    format: uuid
                  estado:
                    type: string
                    description: Estado de candidatura por acordar con el servicio.
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "500":
          $ref: "#/components/responses/ErrorInterno"
components:
  responses:
    NoEncontrado:
      description: Recurso no encontrado.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
    ErrorInterno:
      description: Error interno del servicio.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
  schemas:
    Problema:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        idCorrelacion:
          type: string