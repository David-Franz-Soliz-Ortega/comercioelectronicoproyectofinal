openapi: 3.1.0
info:
  title: Propuesta de API de candidaturas SIGAPE
  version: 1.0.0
  description: CRUD académico mínimo para postulaciones; no contiene expedientes personales.
x-estado-propuesta: pendiente-de-revision-del-equipo
servers:
  - url: /api/v1
security: []
paths:
  /salud:
    get:
      operationId: consultarSaludCandidaturas
      summary: Comprobar servicio y conexión a MongoDB
      responses:
        "200": { description: Servicio y base disponibles. }
        "400": { description: Solicitud inválida. }
        "503": { description: Base de datos no disponible. }
  /candidaturas:
    get:
      operationId: listarCandidaturas
      summary: Listar candidaturas con paginación y filtros
      parameters:
        - $ref: "#/components/parameters/Pagina"
        - $ref: "#/components/parameters/Limite"
        - name: estado
          in: query
          schema: { type: string, enum: [borrador, pendiente, aprobada, rechazada, retirada] }
        - name: idEleccion
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Página de candidaturas.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginaCandidaturas" }
        "400":
          $ref: "#/components/responses/ErrorValidacion"
        "422":
          $ref: "#/components/responses/ErrorValidacion"
    post:
      operationId: crearCandidatura
      summary: Crear una postulación de demostración
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NuevaCandidatura" }
      responses:
        "201":
          description: Candidatura creada.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Candidatura" }
        "422":
          $ref: "#/components/responses/ErrorValidacion"
  /candidaturas/{idCandidatura}:
    parameters:
      - name: idCandidatura
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: consultarCandidatura
      summary: Consultar una candidatura
      responses:
        "200":
          description: Candidatura encontrada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Candidatura" }
        "404":
          $ref: "#/components/responses/NoEncontrado"
    put:
      operationId: actualizarCandidatura
      summary: Reemplazar los campos editables de una candidatura
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NuevaCandidatura" }
      responses:
        "200":
          description: Candidatura actualizada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Candidatura" }
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "422":
          $ref: "#/components/responses/ErrorValidacion"
    delete:
      operationId: eliminarCandidatura
      summary: Eliminar una candidatura en borrador
      responses:
        "204": { description: Candidatura eliminada. }
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          description: Solo se pueden eliminar candidaturas en borrador.
components:
  parameters:
    Pagina:
      name: pagina
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limite:
      name: limite
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  schemas:
    NuevaCandidatura:
      type: object
      additionalProperties: false
      required: [idEleccion, nombre, tipo, estado]
      properties:
        idEleccion: { type: string, format: uuid }
        nombre: { type: string, minLength: 1, maxLength: 120 }
        tipo: { type: string, enum: [individual, lista] }
        estado: { type: string, enum: [borrador, pendiente, aprobada, rechazada, retirada] }
    Candidatura:
      type: object
      additionalProperties: false
      required:
      - idEleccion
      - nombre
      - tipo
      - estado
      - idCandidatura
      - creadoEn
      - actualizadoEn
      properties:
        idEleccion:
          type: string
          format: uuid
        nombre:
          type: string
          minLength: 1
          maxLength: 120
        tipo:
          type: string
          enum:
          - individual
          - lista
        estado:
          type: string
          enum:
          - borrador
          - pendiente
          - aprobada
          - rechazada
          - retirada
        idCandidatura:
          type: string
          format: uuid
        creadoEn:
          type: string
          format: date-time
        actualizadoEn:
          type: string
          format: date-time
    PaginaCandidaturas:
      type: object
      required: [elementos, pagina, limite, total]
      properties:
        elementos:
          type: array
          items: { $ref: "#/components/schemas/Candidatura" }
        pagina: { type: integer }
        limite: { type: integer }
        total: { type: integer }
    Problema:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        idCorrelacion: { type: string }
  responses:
    NoEncontrado:
      description: Candidatura no encontrada.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problema" }
    ErrorValidacion:
      description: Solicitud inválida.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problema" }