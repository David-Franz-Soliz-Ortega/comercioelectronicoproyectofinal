openapi: 3.1.0
info:
  title: Propuesta de API de elecciones SIGAPE
  version: 1.0.0
  description: CRUD académico mínimo de procesos electorales; las reglas electorales completas quedan fuera de esta propuesta.
x-estado-propuesta: pendiente-de-revision-del-equipo
servers:
  - url: /api/v1
security: []
paths:
  /salud:
    get:
      operationId: consultarSaludElecciones
      summary: Comprobar servicio y conexión a PostgreSQL
      responses:
        "200": { description: Servicio y base disponibles. }
        "400": { description: Solicitud inválida. }
        "503": { description: Base de datos no disponible. }
  /elecciones:
    get:
      operationId: listarElecciones
      summary: Listar elecciones con paginación y filtros
      parameters:
        - $ref: "#/components/parameters/Pagina"
        - $ref: "#/components/parameters/Limite"
        - name: estado
          in: query
          schema: { type: string, enum: [borrador, programada, en_curso, finalizada, anulada] }
        - name: nombre
          in: query
          schema: { type: string, maxLength: 120 }
      responses:
        "200":
          description: Página de elecciones.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginaElecciones" }
        "400":
          $ref: "#/components/responses/ErrorValidacion"
    post:
      operationId: crearEleccion
      summary: Crear un proceso electoral de demostración
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NuevaEleccion" }
      responses:
        "201":
          description: Elección creada.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Eleccion" }
        "422":
          $ref: "#/components/responses/ErrorValidacion"
  /elecciones/{idEleccion}:
    parameters:
      - name: idEleccion
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: consultarEleccion
      summary: Consultar una elección
      responses:
        "200":
          description: Elección encontrada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Eleccion" }
        "404":
          $ref: "#/components/responses/NoEncontrado"
    put:
      operationId: actualizarEleccion
      summary: Reemplazar los campos editables de una elección
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NuevaEleccion" }
      responses:
        "200":
          description: Elección actualizada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Eleccion" }
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          description: La elección no admite más modificaciones.
        "422":
          $ref: "#/components/responses/ErrorValidacion"
    delete:
      operationId: eliminarEleccion
      summary: Eliminar una elección que aún está en borrador
      responses:
        "204": { description: Elección eliminada. }
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          description: Solo se pueden eliminar elecciones en borrador.
  /elecciones/{idEleccion}/inscripciones/{idInscripcion}/elegibilidad:
    get:
      operationId: consultarElegibilidadDesdeElecciones
      summary: Consultar al padrón mediante gRPC con deadline
      description: Comprueba la elección propia y delega la inscripción al padrón. No accede a bases ajenas.
      parameters:
        - name: idEleccion
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: idInscripcion
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Elegibilidad sintética consultada por gRPC.
          content:
            application/json:
              schema:
                type: object
                required: [idEleccion, idInscripcion, elegible, idCorrelacion]
                properties:
                  idEleccion: { type: string, format: uuid }
                  idInscripcion: { type: string, format: uuid }
                  elegible: { type: boolean }
                  idCorrelacion: { type: string }
        "400": { description: UUID inválido o INVALID_ARGUMENT del padrón. }
        "404": { description: Elección o inscripción inexistente. }
        "408": { description: CANCELLED del padrón. }
        "409": { description: FAILED_PRECONDITION; inscripción de otra elección. }
        "502": { description: Error inesperado o respuesta gRPC inválida. }
        "503": { description: "UNAVAILABLE, RESOURCE_EXHAUSTED o persistencia local no disponible." }
        "504": { description: DEADLINE_EXCEEDED; plazo gRPC agotado. }
components:
  parameters:
    Pagina:
      name: pagina
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limite:
      name: limite
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  schemas:
    NuevaEleccion:
      type: object
      additionalProperties: false
      required: [nombre, estado]
      properties:
        nombre: { type: string, minLength: 1, maxLength: 120 }
        estado: { type: string, enum: [borrador, programada, en_curso, finalizada, anulada] }
    Eleccion:
      type: object
      additionalProperties: false
      required:
      - nombre
      - estado
      - idEleccion
      - creadoEn
      - actualizadoEn
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 120
        estado:
          type: string
          enum:
          - borrador
          - programada
          - en_curso
          - finalizada
          - anulada
        idEleccion:
          type: string
          format: uuid
        creadoEn:
          type: string
          format: date-time
        actualizadoEn:
          type: string
          format: date-time
    PaginaElecciones:
      type: object
      required: [elementos, pagina, limite, total]
      properties:
        elementos:
          type: array
          items: { $ref: "#/components/schemas/Eleccion" }
        pagina: { type: integer }
        limite: { type: integer }
        total: { type: integer }
    Problema:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        idCorrelacion: { type: string }
        codigoGrpc: { type: integer, description: Código gRPC opcional de elegibilidad. }
        estadoGrpc: { type: string, description: Nombre del estado gRPC. }
  responses:
    NoEncontrado:
      description: Elección no encontrada.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problema" }
    ErrorValidacion:
      description: Solicitud inválida.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problema" }