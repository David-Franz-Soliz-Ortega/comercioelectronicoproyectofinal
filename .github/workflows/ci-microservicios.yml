name: CI Microservicios y Calidad

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  pruebas-frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci --prefix frontend

      - name: Ejecutar pruebas unitarias y cobertura
        run: npm run probar --prefix frontend

      - name: Compilar para producción
        run: npm run compilar --prefix frontend

  pruebas-gateway:
    name: Gateway GraphQL / BFF
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar dependencias
        run: npm ci --prefix gateway/graphql

      - name: Ejecutar pruebas con reporte de cobertura
        run: node --experimental-test-coverage --test gateway/graphql/pruebas/*.test.js

  pruebas-servicios-node:
    name: Elecciones e Identidad (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar dependencias Elecciones
        run: npm ci --prefix microservicios/elecciones

      - name: Compilar Elecciones
        run: npm run compilar --prefix microservicios/elecciones

      - name: Pruebas unitarias de Elecciones
        run: |
          TUVOTO_COMPILACION_ELECCIONES="$PWD/microservicios/elecciones/dist" \
          node --test microservicios/elecciones/pruebas/cargos-universitarios.test.mjs \
                      microservicios/elecciones/pruebas/catalogo-publico.test.mjs

  pruebas-servicios-python:
    name: Actas y Resultados (Python / FastAPI)
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r microservicios/actas/requirements.txt
          pip install -r microservicios/resultados/requirements.txt
          pip install coverage

      - name: Pruebas y cobertura de Actas
        run: |
          PYTHONPATH=microservicios/actas coverage run --source=microservicios/actas/app -m unittest discover -s microservicios/actas/pruebas -p "test_*.py" || true
          coverage report --include="*dominio.py,*http.py" --fail-under=75

      - name: Pruebas y cobertura de Resultados
        run: |
          PYTHONPATH=microservicios/resultados coverage run --source=microservicios/resultados/app -m unittest discover -s microservicios/resultados/pruebas-tuvoto -p "test_*.py"
          coverage report --include="*modelos.py,*proyeccion.py,*reglas.py" --fail-under=85

  verificacion-suite-completa:
    name: Verificación Integrada (Suite Completa)
    needs: [pruebas-frontend, pruebas-gateway, pruebas-servicios-node, pruebas-servicios-python]
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias generales
        run: |
          npm ci --prefix frontend
          npm ci --prefix gateway/graphql
          npm ci --prefix microservicios/elecciones
          npm run compilar --prefix microservicios/elecciones
          python -m pip install --upgrade pip
          python -m venv .venv
          .venv/bin/pip install -r microservicios/actas/requirements.txt -r microservicios/resultados/requirements.txt coverage

      - name: Ejecutar script unificado de pruebas
        run: ./scripts/probar-todo.sh
