apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
    {{- include "tuvoto.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas.frontend }}
  strategy:
    type: {{ .Values.estrategiaDespliegue.type }}
    rollingUpdate:
      maxSurge: {{ .Values.estrategiaDespliegue.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.estrategiaDespliegue.rollingUpdate.maxUnavailable }}
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.imagenes.registry }}/tuvoto-frontend:{{ .Values.imagenes.tag }}"
          imagePullPolicy: {{ .Values.imagenes.pullPolicy }}
          ports:
            - containerPort: {{ .Values.puertos.frontend }}
          resources:
            {{- toYaml .Values.recursos.frontend | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.puertos.frontend }}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.puertos.frontend }}
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
spec:
  ports:
    - port: 80
      targetPort: {{ .Values.puertos.frontend }}
  selector:
    app: frontend
