apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tuvoto.fullname" . }}-config
  labels:
    {{- include "tuvoto.labels" . | nindent 4 }}
data:
  ENTORNO: {{ .Values.global.entorno | quote }}
  DOMINIO: {{ .Values.global.dominio | quote }}
  POSTGRES_HOST: "postgres-svc"
  POSTGRES_PORT: "5432"
  MONGO_HOST: "mongo-svc"
  MONGO_PORT: "27017"
  MONGO_DB: "resultados_db"
  REDIS_HOST: "redis-svc"
  REDIS_PORT: "6379"
  RABBITMQ_HOST: "rabbitmq-svc"
  RABBITMQ_PORT: "5672"
  GRPC_ELECCIONES_HOST: "elecciones-svc"
  GRPC_ELECCIONES_PORT: "50051"
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tuvoto.fullname" . }}-secrets
  labels:
    {{- include "tuvoto.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.baseDatosLocal.postgres.clave | quote }}
  MONGO_PASSWORD: {{ .Values.baseDatosLocal.mongo.clave | quote }}
  RABBITMQ_PASSWORD: {{ .Values.baseDatosLocal.rabbitmq.clave | quote }}
  JWT_SECRET: "SecretoSuperSeguroTuvotoParaProduccion2026!USFX"
