# ======================== IDENTIDAD ========================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identidad
  labels:
    app: identidad
    {{- include "tuvoto.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas.identidad }}
  strategy:
    type: {{ .Values.estrategiaDespliegue.type }}
    rollingUpdate:
      maxSurge: {{ .Values.estrategiaDespliegue.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.estrategiaDespliegue.rollingUpdate.maxUnavailable }}
  selector:
    matchLabels:
      app: identidad
  template:
    metadata:
      labels:
        app: identidad
    spec:
      containers:
        - name: identidad
          image: "{{ .Values.imagenes.registry }}/tuvoto-identidad:{{ .Values.imagenes.tag }}"
          imagePullPolicy: {{ .Values.imagenes.pullPolicy }}
          ports:
            - containerPort: {{ .Values.puertos.identidad }}
          resources:
            {{- toYaml .Values.recursos.backend | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "tuvoto.fullname" . }}-config
            - secretRef:
                name: {{ include "tuvoto.fullname" . }}-secrets
          livenessProbe:
            httpGet:
              path: /api/v1/identidad/salud
              port: {{ .Values.puertos.identidad }}
            initialDelaySeconds: {{ .Values.sondas.inicialDelay }}
            periodSeconds: {{ .Values.sondas.periodo }}
          readinessProbe:
            httpGet:
              path: /api/v1/identidad/salud
              port: {{ .Values.puertos.identidad }}
            initialDelaySeconds: {{ .Values.sondas.inicialDelay }}
            periodSeconds: {{ .Values.sondas.periodo }}
---
apiVersion: v1
kind: Service
metadata:
  name: identidad-svc
spec:
  ports:
    - port: {{ .Values.puertos.identidad }}
      targetPort: {{ .Values.puertos.identidad }}
  selector:
    app: identidad
---
# ======================== ELECCIONES ========================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elecciones
  labels:
    app: elecciones
    {{- include "tuvoto.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas.elecciones }}
  strategy:
    type: {{ .Values.estrategiaDespliegue.type }}
    rollingUpdate:
      maxSurge: {{ .Values.estrategiaDespliegue.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.estrategiaDespliegue.rollingUpdate.maxUnavailable }}
  selector:
    matchLabels:
      app: elecciones
  template:
    metadata:
      labels:
        app: elecciones
    spec:
      containers:
        - name: elecciones
          image: "{{ .Values.imagenes.registry }}/tuvoto-elecciones:{{ .Values.imagenes.tag }}"
          imagePullPolicy: {{ .Values.imagenes.pullPolicy }}
          ports:
            - containerPort: {{ .Values.puertos.eleccionesHttp }}
              name: http
            - containerPort: {{ .Values.puertos.eleccionesGrpc }}
              name: grpc
          resources:
            {{- toYaml .Values.recursos.backend | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "tuvoto.fullname" . }}-config
            - secretRef:
                name: {{ include "tuvoto.fullname" . }}-secrets
          livenessProbe:
            httpGet:
              path: /api/v1/configuracion/salud
              port: {{ .Values.puertos.eleccionesHttp }}
            initialDelaySeconds: {{ .Values.sondas.inicialDelay }}
            periodSeconds: {{ .Values.sondas.periodo }}
          readinessProbe:
            httpGet:
              path: /api/v1/configuracion/salud
              port: {{ .Values.puertos.eleccionesHttp }}
            initialDelaySeconds: {{ .Values.sondas.inicialDelay }}
            periodSeconds: {{ .Values.sondas.periodo }}
---
apiVersion: v1
kind: Service
metadata:
  name: elecciones-svc
spec:
  ports:
    - port: {{ .Values.puertos.eleccionesHttp }}
      name: http
      targetPort: {{ .Values.puertos.eleccionesHttp }}
    - port: {{ .Values.puertos.eleccionesGrpc }}
      name: grpc
      targetPort: {{ .Values.puertos.eleccionesGrpc }}
  selector:
    app: elecciones
---
