# ======================== GATEWAY GRAPHQL / BFF ========================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
    {{- include "tuvoto.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas.gateway }}
  strategy:
    type: {{ .Values.estrategiaDespliegue.type }}
    rollingUpdate:
      maxSurge: {{ .Values.estrategiaDespliegue.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.estrategiaDespliegue.rollingUpdate.maxUnavailable }}
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: "{{ .Values.imagenes.registry }}/tuvoto-gateway:{{ .Values.imagenes.tag }}"
          imagePullPolicy: {{ .Values.imagenes.pullPolicy }}
          ports:
            - containerPort: {{ .Values.puertos.gateway }}
          resources:
            {{- toYaml .Values.recursos.gateway | nindent 12 }}
          env:
            - name: PUERTO
              value: "{{ .Values.puertos.gateway }}"
            - name: URL_ELECCIONES
              value: "http://elecciones-svc:{{ .Values.puertos.eleccionesHttp }}"
            - name: URL_ACTAS
              value: "http://actas-svc:{{ .Values.puertos.actas }}"
            - name: URL_RESULTADOS
              value: "http://resultados-svc:{{ .Values.puertos.resultados }}"
          livenessProbe:
            httpGet:
              path: /salud
              port: {{ .Values.puertos.gateway }}
            initialDelaySeconds: {{ .Values.sondas.inicialDelay }}
            periodSeconds: {{ .Values.sondas.periodo }}
          readinessProbe:
            httpGet:
              path: /salud
              port: {{ .Values.puertos.gateway }}
            initialDelaySeconds: {{ .Values.sondas.inicialDelay }}
            periodSeconds: {{ .Values.sondas.periodo }}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-svc
spec:
  ports:
    - port: {{ .Values.puertos.gateway }}
      targetPort: {{ .Values.puertos.gateway }}
  selector:
    app: gateway
