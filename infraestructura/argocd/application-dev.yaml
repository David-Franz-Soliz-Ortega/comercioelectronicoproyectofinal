apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tuvoto-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/richard/comercioelectronicoproyectofinal.git
    targetRevision: main
    path: infraestructura/helm/tuvoto
    helm:
      valueFiles:
        - values.yaml
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: tuvoto-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
