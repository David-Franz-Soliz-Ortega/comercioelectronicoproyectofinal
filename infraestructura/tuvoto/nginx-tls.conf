# Configuración NGINX con soporte TLS/HTTPS para TUVOTO
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 80;
    server_name localhost tuvoto.local;
    return 301 https://$host:8443$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost tuvoto.local;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 15m;
    absolute_redirect off;

    proxy_set_header X-Servicio "";
    proxy_set_header X-Clave-Servicio "";
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location ^~ /api/v1/interno { return 403; }
    location ^~ /interno { return 403; }

    location = /api/v1/documentacion/identidad { return 308 /api/v1/documentacion/identidad/; }
    location ^~ /api/v1/documentacion/identidad/ { set $destino identidad:3000; rewrite ^/api/v1/documentacion/identidad/(.*)$ /docs/$1 break; proxy_pass http://$destino$uri$is_args$args; }

    location = /api/v1/documentacion/elecciones { return 308 /api/v1/documentacion/elecciones/; }
    location ^~ /api/v1/documentacion/elecciones/ { set $destino elecciones:3000; rewrite ^/api/v1/documentacion/elecciones/(.*)$ /docs/$1 break; proxy_pass http://$destino$uri$is_args$args; }

    location = /api/v1/documentacion/actas { set $destino actas:8000; proxy_pass http://$destino/docs; }
    location = /api/v1/esquemas/actas { set $destino actas:8000; proxy_pass http://$destino/openapi.json; }

    location = /api/v1/documentacion/resultados { set $destino resultados:8000; proxy_pass http://$destino/docs; }
    location = /api/v1/esquemas/resultados { set $destino resultados:8000; proxy_pass http://$destino/openapi.json; }

    location ^~ /api/v1/autenticacion { set $destino identidad:3000; proxy_pass http://$destino$request_uri; }
    location ^~ /api/v1/importaciones { set $destino identidad:3000; proxy_pass http://$destino$request_uri; proxy_read_timeout 180s; }
    location ^~ /api/v1/usuarios { set $destino identidad:3000; proxy_pass http://$destino$request_uri; }
    location ^~ /api/v1/organizaciones { set $destino identidad:3000; proxy_pass http://$destino$request_uri; }

    location ^~ /api/v1/configuracion { set $destino elecciones:3000; proxy_pass http://$destino$request_uri; }
    location ^~ /api/v1/mis-mesas { set $destino elecciones:3000; proxy_pass http://$destino$request_uri; }
    location ^~ /api/v1/mesas { set $destino elecciones:3000; proxy_pass http://$destino$request_uri; }

    location ^~ /api/v1/publico/resultados { set $destino resultados:8000; proxy_pass http://$destino$request_uri; }
    location ^~ /api/v1/publico/actas { set $destino actas:8000; proxy_pass http://$destino$request_uri; }
    location ^~ /api/v1/publico { set $destino elecciones:3000; proxy_pass http://$destino$request_uri; }

    location ^~ /api/v1/informes { set $destino resultados:8000; proxy_pass http://$destino$request_uri; }
    location ^~ /api/v1/actas { set $destino actas:8000; proxy_pass http://$destino$request_uri; }

    location = /graphql { set $destino gateway-graphql:4000; proxy_pass http://$destino$request_uri; proxy_read_timeout 20s; }
    location = /salud { return 200 'TUVOTO TLS'; }
    location ^~ /api/ { return 404; }

    location / { set $destino frontend:3000; proxy_pass http://$destino$request_uri; }
}
