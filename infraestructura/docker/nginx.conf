resolver 127.0.0.11 valid=10s ipv6=off;

map $http_x_correlation_id $id_correlacion {
    default $http_x_correlation_id;
    ""      $request_id;
}

server {
    listen 80;
    server_name _;

    location /graphql {
        set $destino_gateway http://gateway-graphql:4000;
        proxy_pass $destino_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $id_correlacion;
    }

    location / {
        set $destino_frontend http://frontend:3000;
        proxy_pass $destino_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $id_correlacion;
    }
}