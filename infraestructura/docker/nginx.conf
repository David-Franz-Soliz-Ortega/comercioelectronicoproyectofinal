resolver 127.0.0.11 valid=10s ipv6=off;

map $http_x_correlation_id $id_correlacion {
    default $http_x_correlation_id;
    ""      $request_id;
}

server {
    listen 80;
    server_name _;
    absolute_redirect off;

    # Evitar que clientes externos suplanten la identidad de microservicios internos
    proxy_set_header X-Servicio "";
    proxy_set_header X-Clave-Servicio "";

    # Bloquear rutas internas del servicio de identidad desde el exterior
    location ^~ /api/v1/interno {
        return 403;
    }

    location ^~ /interno {
        return 403;
    }

    location = /api/v1/identidades/openapi.yaml {
        proxy_pass http://identidad:3000/openapi.yaml;
    }

    location = /api/v1/elecciones/openapi.yaml {
        proxy_pass http://elecciones:3000/openapi.yaml;
    }

    location = /api/v1/candidaturas/openapi.yaml {
        proxy_pass http://candidaturas:8000/openapi.yaml;
    }

    location = /api/v1/inscripciones/openapi.yaml {
        proxy_pass http://padron-electoral:3000/openapi.yaml;
    }

    location = /documentacion/identidad {
        return 308 /documentacion/identidad/;
    }

    location ^~ /documentacion/identidad/ {
        proxy_pass http://identidad:3000/docs/;
    }

    location = /documentacion/elecciones {
        return 308 /documentacion/elecciones/;
    }

    location ^~ /documentacion/elecciones/ {
        proxy_pass http://elecciones:3000/docs/;
    }

    location = /documentacion/candidaturas {
        proxy_pass http://candidaturas:8000/docs;
    }

    location = /documentacion/padron-electoral {
        return 308 /documentacion/padron-electoral/;
    }

    location ^~ /documentacion/padron-electoral/ {
        proxy_pass http://padron-electoral:3000/docs/;
    }

    location = /api/v1/salud/identidad {
        proxy_pass http://identidad:3000/api/v1/salud;
    }

    location = /api/v1/salud/elecciones {
        proxy_pass http://elecciones:3000/api/v1/salud;
    }

    location = /api/v1/salud/candidaturas {
        proxy_pass http://candidaturas:8000/api/v1/salud;
    }

    location = /api/v1/salud/padron-electoral {
        proxy_pass http://padron-electoral:3000/api/v1/salud;
    }

    location ^~ /api/v1/identidades {
        proxy_pass http://identidad:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Correlation-ID $id_correlacion;
        proxy_set_header X-Servicio "";
        proxy_set_header X-Clave-Servicio "";
    }

    location ^~ /api/v1/autenticacion {
        proxy_pass http://identidad:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Correlation-ID $id_correlacion;
        proxy_set_header X-Servicio "";
        proxy_set_header X-Clave-Servicio "";
    }

    location ^~ /autenticacion {
        proxy_pass http://identidad:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Correlation-ID $id_correlacion;
        proxy_set_header X-Servicio "";
        proxy_set_header X-Clave-Servicio "";
    }

    location ^~ /api/v1/usuarios {
        proxy_pass http://identidad:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Correlation-ID $id_correlacion;
        proxy_set_header X-Servicio "";
        proxy_set_header X-Clave-Servicio "";
    }

    location ^~ /api/v1/organizaciones {
        proxy_pass http://identidad:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Correlation-ID $id_correlacion;
        proxy_set_header X-Servicio "";
        proxy_set_header X-Clave-Servicio "";
    }

    location ^~ /api/v1/auditoria-seguridad {
        proxy_pass http://identidad:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Correlation-ID $id_correlacion;
        proxy_set_header X-Servicio "";
        proxy_set_header X-Clave-Servicio "";
    }

    location ^~ /api/v1/elecciones {
        proxy_pass http://elecciones:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Correlation-ID $id_correlacion;
        proxy_set_header X-Servicio "";
        proxy_set_header X-Clave-Servicio "";
    }

    location ^~ /api/v1/candidaturas {
        proxy_pass http://candidaturas:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Correlation-ID $id_correlacion;
        proxy_set_header X-Servicio "";
        proxy_set_header X-Clave-Servicio "";
    }

    location ^~ /api/v1/inscripciones {
        proxy_pass http://padron-electoral:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Correlation-ID $id_correlacion;
        proxy_set_header X-Servicio "";
        proxy_set_header X-Clave-Servicio "";
    }

    location = /api/v1/salud/votacion {
        set $destino_votacion http://votacion:8080;
        proxy_pass $destino_votacion/api/v1/salud;
    }

    location = /api/v1/salud/resultados {
        set $destino_resultados http://resultados:8000;
        proxy_pass $destino_resultados/api/v1/salud;
    }

    location = /api/v1/votos/openapi.yaml {
        set $destino_votacion http://votacion:8080;
        proxy_pass $destino_votacion/openapi.yaml;
    }

    location = /api/v1/resultados/openapi.yaml {
        set $destino_resultados http://resultados:8000;
        proxy_pass $destino_resultados/openapi.yaml;
    }

    location ^~ /api/v1/votos {
        set $destino_votacion http://votacion:8080;
        proxy_pass $destino_votacion;
        proxy_set_header Host $host;
        proxy_set_header X-Correlation-ID $id_correlacion;
        proxy_set_header X-Servicio "";
        proxy_set_header X-Clave-Servicio "";
    }

    location ^~ /api/v1/resultados {
        set $destino_resultados http://resultados:8000;
        proxy_pass $destino_resultados;
        proxy_set_header Host $host;
        proxy_set_header X-Correlation-ID $id_correlacion;
        proxy_set_header X-Servicio "";
        proxy_set_header X-Clave-Servicio "";
    }

    location = /api/v1/salud/graphql {
        set $destino_gateway http://gateway-graphql:4000;
        proxy_pass $destino_gateway/api/v1/salud;
    }

    location = /graphql/esquema.graphql {
        set $destino_gateway http://gateway-graphql:4000;
        proxy_pass $destino_gateway;
    }

    location = /graphql {
        set $destino_gateway http://gateway-graphql:4000;
        proxy_pass $destino_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $id_correlacion;
        proxy_set_header X-Servicio "";
        proxy_set_header X-Clave-Servicio "";
    }

    location = /api/v1/salud/frontend {
        set $destino_frontend http://frontend:3000;
        proxy_pass $destino_frontend/salud;
    }

    location / {
        set $destino_frontend http://frontend:3000;
        proxy_pass $destino_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $id_correlacion;
        proxy_set_header X-Servicio "";
        proxy_set_header X-Clave-Servicio "";
    }
}