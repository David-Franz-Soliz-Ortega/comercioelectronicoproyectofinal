<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cartel del puesto · TUVOTO</title>
  <link rel="stylesheet" href="/cartel.css">
</head>
<body>
  <main class="cartel">
    <p class="marca">TU<b>VOTO</b></p>
    <h1>Escanea y mira el conteo en vivo</h1>
    <p class="bajada">¿Quieres ser operador? Pide tu tarjeta, fotografía un acta y mírala viajar por los microservicios en el monitor.</p>
    <img class="qr" src="/qr.svg" alt="Código QR del portal de TUVOTO">
    <ol class="pasos">
      <li><span>1</span>Escanea el código</li>
      <li><span>2</span>Entra como operador</li>
      <li><span>3</span>Fotografía un acta de práctica</li>
    </ol>
    <p class="pie">Datos de práctica: ninguna elección real.</p>
  </main>
</body>
</html>
