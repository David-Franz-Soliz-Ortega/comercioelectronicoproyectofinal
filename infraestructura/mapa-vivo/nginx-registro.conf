# Registro adicional para el mapa vivo; se monta solo con docker-compose.mapa-vivo.yml.
# Incluye método, ruta sin consulta, estado y duración. Nunca cabeceras, cookies ni cuerpos.
# La dirección del cliente solo sirve para contar dispositivos y el observador no la guarda.
# Detrás de un túnel (ngrok) todas las conexiones llegan desde 127.0.0.1: se usa la que
# informa el túnel en X-Forwarded-For. Falsificarla solo alteraría ese conteo.
map $http_x_forwarded_for $cliente_mapa_vivo { "" $remote_addr; default $http_x_forwarded_for; }
log_format mapa_vivo escape=json '{"m":"$request_method","u":"$uri","s":"$status","t":"$request_time","c":"$cliente_mapa_vivo","p":"$http_x_mapa_vivo_prueba"}';
access_log syslog:server=mapa-vivo:5140,tag=tuvoto,nohostname mapa_vivo;
