name: tuvoto

x-python: &salud-python
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 20s
x-actas: &entorno-actas
  DB_HOST: base-postgres
  FERIA_ORGANIZACION_REGISTRO_UNICO: ${TUVOTO_FERIA_ORGANIZACION_REGISTRO_UNICO:-}
  DB_NAME: actas_db
  DB_USER: actas_app
  DB_PASSWORD: ${TUVOTO_ACTAS_CLAVE:?Define credenciales TUVOTO independientes}
  IDENTIDAD_URL: http://identidad:3000
  ELECCIONES_URL: http://elecciones:3000
  ELECCIONES_GRPC: elecciones:50051
  CLAVE_SERVICIO: ${TUVOTO_INTERNA_ACTAS:?Define clave interna de actas}
  RABBITMQ_HOST: mensajeria-rabbitmq
  RABBITMQ_USUARIO: tuvoto_app
  RABBITMQ_CLAVE: ${TUVOTO_RABBIT_CLAVE:?Define clave RabbitMQ}
x-resultados: &entorno-resultados
  MONGODB_HOST: base-mongodb
  MONGODB_DATABASE: resultados_db
  MONGODB_USERNAME: resultados_app
  MONGODB_PASSWORD: ${TUVOTO_RESULTADOS_CLAVE:?Define clave de resultados}
  RABBITMQ_HOST: mensajeria-rabbitmq
  RABBITMQ_USUARIO: tuvoto_app
  RABBITMQ_CLAVE: ${TUVOTO_RABBIT_CLAVE:?Define clave RabbitMQ}
  ELECCIONES_URL: http://elecciones:3000
  REDIS_HOST: cache-redis
  IDENTIDAD_URL: http://identidad:3000
  CLAVE_SERVICIO: ${TUVOTO_INTERNA_RESULTADOS:?Define clave interna de resultados}

services:
  base-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tuvoto_admin
      POSTGRES_PASSWORD: ${TUVOTO_POSTGRES_CLAVE:?Define clave PostgreSQL}
      POSTGRES_DB: postgres
      IDENTIDAD_DB_USUARIO: identidad_app
      IDENTIDAD_DB_CLAVE: ${TUVOTO_IDENTIDAD_CLAVE:?Define clave de identidad}
      ELECCIONES_DB_USUARIO: elecciones_app
      ELECCIONES_DB_CLAVE: ${TUVOTO_ELECCIONES_CLAVE:?Define clave de elecciones}
      ACTAS_DB_USUARIO: actas_app
      ACTAS_DB_CLAVE: ${TUVOTO_ACTAS_CLAVE:?Define clave de actas}
    volumes:
      - datos_postgres:/var/lib/postgresql/data
      - ./infraestructura/tuvoto/inicializar-postgres.sh:/docker-entrypoint-initdb.d/10-bases.sh:ro
    networks: [interna]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U tuvoto_admin -d postgres']
      interval: 5s
      timeout: 3s
      retries: 15
  base-mongodb:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: tuvoto_admin
      MONGO_INITDB_ROOT_PASSWORD: ${TUVOTO_MONGO_CLAVE:?Define clave MongoDB}
      RESULTADOS_DB_CLAVE: ${TUVOTO_RESULTADOS_CLAVE:?Define clave de resultados}
    volumes:
      - datos_mongodb:/data/db
      - configuracion_mongodb:/data/configdb
      - ./infraestructura/tuvoto/inicializar-mongodb.sh:/docker-entrypoint-initdb.d/10-bases.sh:ro
    networks: [interna]
    healthcheck:
      <<: *salud-python
      test: [CMD, mongosh, --quiet, --eval, 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)']
  cache-redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [interna]
    command: [redis-server, --save, '', --appendonly, 'no']
    healthcheck:
      <<: *salud-python
      test: [CMD, redis-cli, ping]
  mensajeria-rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    hostname: tuvoto-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: tuvoto_app
      RABBITMQ_DEFAULT_PASS: ${TUVOTO_RABBIT_CLAVE:?Define clave RabbitMQ}
    volumes: [datos_rabbitmq:/var/lib/rabbitmq]
    networks: [interna]
    healthcheck:
      <<: *salud-python
      test: [CMD, rabbitmq-diagnostics, -q, ping]
  identidad:
    build: {context: ., dockerfile: microservicios/identidad/Dockerfile}
    restart: unless-stopped
    environment:
      PORT: '3000'
      DB_HOST: base-postgres
      DB_PORT: '5432'
      DB_NAME: identidad_db
      DB_USER: identidad_app
      DB_PASSWORD: ${TUVOTO_IDENTIDAD_CLAVE:?Define clave de identidad}
      ORIGEN_PUBLICO: ${TUVOTO_ORIGEN:?Define origen público exacto}
      COOKIE_SEGURA: ${TUVOTO_COOKIE_SEGURA:?Define true para HTTPS o false para HTTP local}
      CLAVE_INTERNA_ELECCIONES: ${TUVOTO_INTERNA_ELECCIONES:?Define clave interna de elecciones}
      CLAVE_INTERNA_ACTAS: ${TUVOTO_INTERNA_ACTAS:?Define clave interna de actas}
      CLAVE_INTERNA_RESULTADOS: ${TUVOTO_INTERNA_RESULTADOS:?Define clave interna de resultados}
    networks: [interna]
    depends_on: {base-postgres: {condition: service_healthy}}
    healthcheck:
      <<: *salud-python
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/v1/salud').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
  elecciones:
    build: {context: ., dockerfile: microservicios/elecciones/Dockerfile}
    restart: unless-stopped
    environment:
      DB_HOST: base-postgres
      DB_NAME: elecciones_db
      DB_USER: elecciones_app
      DB_PASSWORD: ${TUVOTO_ELECCIONES_CLAVE:?Define clave de elecciones}
      IDENTIDAD_URL: http://identidad:3000
      CLAVE_SERVICIO: ${TUVOTO_INTERNA_ELECCIONES:?Define clave interna de elecciones}
      CLAVE_CLIENTE_ACTAS: ${TUVOTO_INTERNA_ACTAS:?Define clave de cliente gRPC}
    networks: [interna]
    depends_on: {base-postgres: {condition: service_healthy}, identidad: {condition: service_healthy}}
    healthcheck:
      <<: *salud-python
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/v1/salud').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
  actas:
    build: {context: ., dockerfile: microservicios/actas/Dockerfile}
    restart: unless-stopped
    environment: *entorno-actas
    networks: [interna]
    depends_on: {base-postgres: {condition: service_healthy}, identidad: {condition: service_healthy}, elecciones: {condition: service_healthy}, mensajeria-rabbitmq: {condition: service_healthy}, resultados-conteo: {condition: service_healthy}, resultados-auditoria: {condition: service_healthy}}
    healthcheck:
      <<: *salud-python
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/salud',timeout=3)"]
  resultados-conteo:
    build: {context: ., dockerfile: microservicios/resultados/Dockerfile}
    restart: unless-stopped
    command: [python, -m, app.consumidor]
    environment: {<<: *entorno-resultados, MODO_CONSUMIDOR: conteo}
    networks: [interna]
    depends_on: {base-mongodb: {condition: service_healthy}, mensajeria-rabbitmq: {condition: service_healthy}}
    healthcheck:
      <<: *salud-python
      test: [CMD, python, -c, "import os,time; assert time.time()-os.stat('/tmp/salud-consumidor').st_mtime<20"]
  resultados-auditoria:
    build: {context: ., dockerfile: microservicios/resultados/Dockerfile}
    restart: unless-stopped
    command: [python, -m, app.consumidor]
    environment: {<<: *entorno-resultados, MODO_CONSUMIDOR: auditoria}
    networks: [interna]
    depends_on: {base-mongodb: {condition: service_healthy}, mensajeria-rabbitmq: {condition: service_healthy}}
    healthcheck:
      <<: *salud-python
      test: [CMD, python, -c, "import os,time; assert time.time()-os.stat('/tmp/salud-consumidor').st_mtime<20"]
  resultados:
    build: {context: ., dockerfile: microservicios/resultados/Dockerfile}
    restart: unless-stopped
    environment: *entorno-resultados
    networks: [interna]
    depends_on: {base-mongodb: {condition: service_healthy}, resultados-conteo: {condition: service_healthy}, resultados-auditoria: {condition: service_healthy}}
    healthcheck:
      <<: *salud-python
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/salud',timeout=3)"]
  gateway-graphql:
    build: {context: ., dockerfile: gateway/graphql/Dockerfile}
    restart: unless-stopped
    environment:
      ELECCIONES_URL: http://elecciones:3000
      RESULTADOS_URL: http://resultados:8000
      ACTAS_URL: http://actas:8000
    networks: [interna]
    depends_on: {elecciones: {condition: service_healthy}, resultados: {condition: service_healthy}}
  frontend:
    build: {context: ., dockerfile: frontend/Dockerfile}
    restart: unless-stopped
    networks: [interna]
  entrada-nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports: ['127.0.0.1:${TUVOTO_PUERTO:?Define un puerto libre distinto de 8080 y 8888}:80']
    volumes: ['./infraestructura/tuvoto/nginx.conf:/etc/nginx/conf.d/default.conf:ro']
    networks: [entrada, interna]
    depends_on: {frontend: {condition: service_healthy}, gateway-graphql: {condition: service_healthy}, actas: {condition: service_healthy}}
    healthcheck:
      <<: *salud-python
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/salud]
networks:
  entrada: {}
  interna: {internal: true}
volumes:
  datos_postgres: {}
  datos_mongodb: {}
  configuracion_mongodb: {}
  datos_rabbitmq: {}
