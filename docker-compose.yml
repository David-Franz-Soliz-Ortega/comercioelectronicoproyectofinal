name: sigape

services:
  base-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USUARIO:?Define POSTGRES_ADMIN_USUARIO en .env}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_CLAVE:?Define POSTGRES_ADMIN_CLAVE en .env}
      POSTGRES_DB: postgres
      IDENTIDAD_DB: identidad_db
      IDENTIDAD_DB_USUARIO: ${IDENTIDAD_DB_USUARIO:?Define IDENTIDAD_DB_USUARIO en .env}
      IDENTIDAD_DB_CLAVE: ${IDENTIDAD_DB_CLAVE:?Define IDENTIDAD_DB_CLAVE en .env}
      ELECCIONES_DB: elecciones_db
      ELECCIONES_DB_USUARIO: ${ELECCIONES_DB_USUARIO:?Define ELECCIONES_DB_USUARIO en .env}
      ELECCIONES_DB_CLAVE: ${ELECCIONES_DB_CLAVE:?Define ELECCIONES_DB_CLAVE en .env}
      PADRON_ELECTORAL_DB: padron_electoral_db
      PADRON_ELECTORAL_DB_USUARIO: ${PADRON_ELECTORAL_DB_USUARIO:?Define PADRON_ELECTORAL_DB_USUARIO en .env}
      PADRON_ELECTORAL_DB_CLAVE: ${PADRON_ELECTORAL_DB_CLAVE:?Define PADRON_ELECTORAL_DB_CLAVE en .env}
      VOTACION_DB: votacion_db
      VOTACION_DB_USUARIO: ${VOTACION_DB_USUARIO:?Define VOTACION_DB_USUARIO en .env}
      VOTACION_DB_CLAVE: ${VOTACION_DB_CLAVE:?Define VOTACION_DB_CLAVE en .env}
    volumes:
      - datos_postgres:/var/lib/postgresql/data
      - ./infraestructura/docker/inicializar-postgres.sh:/docker-entrypoint-initdb.d/10-inicializar-bases.sh:ro
    networks:
      - red_interna
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  base-mongodb:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ADMIN_USUARIO:?Define MONGODB_ADMIN_USUARIO en .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ADMIN_CLAVE:?Define MONGODB_ADMIN_CLAVE en .env}
      CANDIDATURAS_DB: candidaturas_db
      CANDIDATURAS_DB_USUARIO: ${CANDIDATURAS_DB_USUARIO:?Define CANDIDATURAS_DB_USUARIO en .env}
      CANDIDATURAS_DB_CLAVE: ${CANDIDATURAS_DB_CLAVE:?Define CANDIDATURAS_DB_CLAVE en .env}
      RESULTADOS_DB: resultados_db
      RESULTADOS_DB_USUARIO: ${RESULTADOS_DB_USUARIO:?Define RESULTADOS_DB_USUARIO en .env}
      RESULTADOS_DB_CLAVE: ${RESULTADOS_DB_CLAVE:?Define RESULTADOS_DB_CLAVE en .env}
    volumes:
      - datos_mongodb:/data/db
      - ./infraestructura/docker/inicializar-mongodb.sh:/docker-entrypoint-initdb.d/10-inicializar-bases.sh:ro
    networks:
      - red_interna
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME"
          --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin
          --eval "db.adminCommand('ping').ok" | grep -q 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  cache-redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_CLAVE: ${REDIS_CLAVE:?Define REDIS_CLAVE en .env}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_CLAVE:?Define REDIS_CLAVE en .env}"]
    volumes:
      - datos_redis:/data
    networks:
      - red_interna
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_CLAVE\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12

  mensajeria-rabbitmq:
    image: rabbitmq:4-management
    hostname: sigape-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_ADMIN_USUARIO:?Define RABBITMQ_ADMIN_USUARIO en .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_ADMIN_CLAVE:?Define RABBITMQ_ADMIN_CLAVE en .env}
    volumes:
      - datos_rabbitmq:/var/lib/rabbitmq
    networks:
      - red_interna
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  configurar-mensajeria:
    image: rabbitmq:4-management
    entrypoint: ["rabbitmqadmin"]
    command: ["definitions", "import", "--file", "/etc/rabbitmq/definiciones.json", "--non-interactive"]
    environment:
      RABBITMQADMIN_TARGET_HOST: mensajeria-rabbitmq
      RABBITMQADMIN_USERNAME: ${RABBITMQ_ADMIN_USUARIO:?Define RABBITMQ_ADMIN_USUARIO en .env}
      RABBITMQADMIN_PASSWORD: ${RABBITMQ_ADMIN_CLAVE:?Define RABBITMQ_ADMIN_CLAVE en .env}
      RABBITMQADMIN_NON_INTERACTIVE_MODE: "true"
    volumes:
      - ./infraestructura/docker/definiciones-rabbitmq.json:/etc/rabbitmq/definiciones.json:ro
    networks:
      - red_interna
    depends_on:
      mensajeria-rabbitmq:
        condition: service_healthy
    restart: "no"

  entrada-nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "${PUERTO_HTTP_PUBLICO:-8080}:80"
    volumes:
      - ./infraestructura/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - red_entrada
      - red_interna
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  red_entrada:
    driver: bridge
  red_interna:
    driver: bridge
    internal: true

volumes:
  datos_postgres:
  datos_mongodb:
  datos_redis:
  datos_rabbitmq: