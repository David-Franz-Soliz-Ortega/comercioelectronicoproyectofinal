# Proyecto aislado: no utiliza volúmenes ni red de SIGAPE en ejecución.
services:
  base-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: votacion_prueba
      POSTGRES_PASSWORD: ${CLAVE_PRUEBA:?}
      POSTGRES_DB: votacion_db
    volumes: [postgres_pruebas:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U votacion_prueba -d votacion_db']
      interval: 2s
      timeout: 3s
      retries: 30
  base-mongodb:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: resultados_prueba
      MONGO_INITDB_ROOT_PASSWORD: ${CLAVE_PRUEBA:?}
    volumes: [mongo_pruebas:/data/db]
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, 'quit(db.adminCommand("ping").ok ? 0 : 1)']
      interval: 2s
      timeout: 3s
      retries: 30
  cache-redis:
    image: redis:7-alpine
    command: [redis-server, --requirepass, '${CLAVE_PRUEBA:?}']
    healthcheck:
      test: [CMD, redis-cli, -a, '${CLAVE_PRUEBA:?}', ping]
      interval: 2s
      timeout: 3s
      retries: 30
  mensajeria-rabbitmq:
    image: rabbitmq:4-management
    hostname: mensajeria-pruebas
    environment:
      RABBITMQ_DEFAULT_USER: mensajeria_prueba
      RABBITMQ_DEFAULT_PASS: ${CLAVE_PRUEBA:?}
    volumes: [rabbit_pruebas:/var/lib/rabbitmq]
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 3s
      timeout: 5s
      retries: 40
  votacion:
    build:
      context: ../../..
      dockerfile: microservicios/votacion/Dockerfile
    environment:
      DB_USER: votacion_prueba
      DB_PASSWORD: ${CLAVE_PRUEBA:?}
      REDIS_CLAVE: ${CLAVE_PRUEBA:?}
      RABBITMQ_USUARIO: mensajeria_prueba
      RABBITMQ_CLAVE: ${CLAVE_PRUEBA:?}
    depends_on:
      base-postgres: {condition: service_healthy}
      cache-redis: {condition: service_healthy}
      mensajeria-rabbitmq: {condition: service_healthy}
  resultados:
    build: &imagen
      context: ../../..
      dockerfile: microservicios/resultados/Dockerfile
    environment: &entorno
      MONGODB_USERNAME: resultados_prueba
      MONGODB_PASSWORD: ${CLAVE_PRUEBA:?}
      MONGODB_AUTH_SOURCE: admin
      RABBITMQ_USUARIO: mensajeria_prueba
      RABBITMQ_CLAVE: ${CLAVE_PRUEBA:?}
    depends_on:
      base-mongodb: {condition: service_healthy}
  resultados-conteo:
    build: *imagen
    command: [python, -m, app.consumidor]
    environment:
      <<: *entorno
      CONSUMIDOR: conteo
    depends_on:
      base-mongodb: {condition: service_healthy}
      mensajeria-rabbitmq: {condition: service_healthy}
  resultados-auditoria:
    build: *imagen
    command: [python, -m, app.consumidor]
    environment:
      <<: *entorno
      CONSUMIDOR: auditoria
    depends_on:
      base-mongodb: {condition: service_healthy}
      mensajeria-rabbitmq: {condition: service_healthy}
  entrada-nginx:
    image: nginx:1.29-alpine
    volumes:
      - ../../../infraestructura/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # Las cuatro API existentes no forman parte de este entorno aislado.
    extra_hosts:
      - identidad:127.0.0.1
      - elecciones:127.0.0.1
      - candidaturas:127.0.0.1
      - padron-electoral:127.0.0.1
    depends_on:
      votacion: {condition: service_healthy}
      resultados: {condition: service_healthy}
  pruebas:
    build: *imagen
    profiles: [pruebas]
    user: '0:0'
    environment:
      <<: *entorno
      PYTHONPATH: /app
    command: [python, /pruebas/integracion.py, inicial]
    volumes:
      - ../../resultados/pruebas:/pruebas:ro
      - evidencia:/evidencia
volumes:
  postgres_pruebas:
  mongo_pruebas:
  rabbit_pruebas:
  evidencia:
