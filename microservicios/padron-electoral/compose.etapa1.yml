# Proyecto separado del Compose compartido. No inicia servicios de otros integrantes.
name: sigape-integrante2-padron
services:
  base-postgres:
    image: postgres:17-alpine
    env_file: .env
    environment:
      POSTGRES_DB: postgres
    command: [postgres, -c, shared_buffers=16MB, -c, max_connections=20, -c, work_mem=2MB]
    mem_limit: 128m
    cpus: 0.50
    volumes:
      - datos_padron:/var/lib/postgresql/data
      - ./desarrollo/inicializar-postgres.sh:/docker-entrypoint-initdb.d/10-padron.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d postgres']
      interval: 10s
      timeout: 3s
      retries: 12
    networks: [interna]
  padron-electoral:
    build:
      context: ../..
      dockerfile: microservicios/padron-electoral/Dockerfile
    env_file: .env
    environment:
      NODE_OPTIONS: --max-old-space-size=64
    mem_limit: 128m
    cpus: 0.50
    ports: ["127.0.0.1:${PUERTO_HTTP_PADRON:-3004}:3000"]
    volumes:
      - ./pruebas:/app/pruebas:ro
    depends_on:
      base-postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/salud').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 4s
      retries: 6
    networks: [interna]
networks:
  interna:
volumes:
  datos_padron:
